<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBLEPA — Interactive 3D System Architecture Mind Map</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; overflow: hidden; height: 100vh; width: 100vw; }
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }

        header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 12px;
            pointer-events: none;
        }

        h1 { font-size: 1.3rem; background: linear-gradient(135deg, #34d399, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.sub { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }

        #modal {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 340px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid #34d399;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 20;
            display: none;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #modal h2 { font-size: 1.1rem; color: #34d399; margin-bottom: 8px; }
        #modal p { font-size: 0.9rem; color: #cbd5e1; line-height: 1.5; }
        #modal .close-btn { position: absolute; top: 12px; right: 15px; background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }

        .hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #64748b;
            font-size: 0.8rem;
            pointer-events: none;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <header>
        <h1>🏛️ WBLEPA 3D Architecture Mind Map</h1>
        <p class="sub">Click nodes to inspect subsystem details & validation metrics</p>
    </header>

    <div id="canvas-container"></div>

    <div id="modal">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <h2 id="modal-title">Node Details</h2>
        <p id="modal-desc">Select a node in the 3D mind map to inspect its function.</p>
    </div>

    <div class="hint">🖱️ Drag to rotate | Scroll to zoom | Click node for details</div>

    <script>
        const nodesData = [
            { id: 0, title: "WBLEPA Core Engine", desc: "Central orchestration engine coordinating public data scraping, SQLite retrieval, Gemini LLM synthesis, and API delivery.", color: 0x10b981, size: 2.2, pos: [0, 0, 0] },
            { id: 1, title: "Data Scraper Layer", desc: "Ingests 7 public HTML source snapshots (City FAQ, HdL Portal, CalGold) with automated retry fallback.", color: 0x3b82f6, size: 1.4, pos: [-6, 3, 2] },
            { id: 2, title: "SQLite Corpus DB", desc: "Stores 22 structured content chunks with FTS5 virtual table indexing for high-speed local search.", color: 0x8b5cf6, size: 1.4, pos: [6, 3, -2] },
            { id: 3, title: "Retrieval Engine", desc: "Keyword + topic-tag boosted search engine achieving 100.0% top-5 hit rate across all test personas.", color: 0xec4899, size: 1.4, pos: [-6, -3, -2] },
            { id: 4, title: "AI Generation Layer", desc: "Google Gemini RAG synthesis enforcing strict citation rules [chk_id], zero hallucination, and disclaimer notices.", color: 0xf59e0b, size: 1.4, pos: [6, -3, 2] },
            { id: 5, title: "FastAPI Backend", desc: "ASGI web server providing /health, /eligibility, /checklist, and /sources with slowapi rate limiting (15 req/min).", color: 0x06b6d4, size: 1.4, pos: [0, 6, -3] },
            { id: 6, title: "Web UI & Termux CLI", desc: "Responsive glassmorphism web client (Vercel) and interactive terminal CLI client (Termux).", color: 0x10b981, size: 1.4, pos: [0, -6, 3] },
            { id: 7, title: "GitHub Actions Cron", desc: "Weekly automated workflow (.github/workflows/refresh_corpus.yml) keeping knowledge base up to date.", color: 0x64748b, size: 1.2, pos: [0, 0, 7] }
        ];

        let scene, camera, renderer, raycaster, mouse;
        let nodeMeshes = [];
        let autoRotate = true;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0b0f19, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x34d399, 1.5, 50);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Create nodes and connecting lines
            nodesData.forEach(data => {
                const geo = new THREE.SphereGeometry(data.size, 32, 32);
                const mat = new THREE.MeshPhongMaterial({
                    color: data.color,
                    emissive: data.color,
                    emissiveIntensity: 0.2,
                    shininess: 80
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(...data.pos);
                mesh.userData = data;
                scene.add(mesh);
                nodeMeshes.push(mesh);

                if (data.id !== 0) {
                    const lineMat = new THREE.LineBasicMaterial({ color: 0x334155, linewidth: 2 });
                    const points = [new THREE.Vector3(0,0,0), new THREE.Vector3(...data.pos)];
                    const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                    const line = new THREE.Line(lineGeo, lineMat);
                    scene.add(line);
                }
            });

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onNodeClick);

            setupInteraction();
            animate();
        }

        function setupInteraction() {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            window.addEventListener('mousedown', (e) => {
                isDragging = true;
                autoRotate = false;
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };
                    scene.rotation.y += deltaMove.x * 0.005;
                    scene.rotation.x += deltaMove.y * 0.005;
                }
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('wheel', (e) => {
                camera.position.z += e.deltaY * 0.01;
                camera.position.z = Math.max(8, Math.min(35, camera.position.z));
            });
        }

        function onNodeClick(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodeMeshes);

            if (intersects.length > 0) {
                const nodeData = intersects[0].object.userData;
                document.getElementById('modal-title').innerText = nodeData.title;
                document.getElementById('modal-desc').innerText = nodeData.desc;
                document.getElementById('modal').style.display = 'block';
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (autoRotate) {
                scene.rotation.y += 0.003;
            }
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
